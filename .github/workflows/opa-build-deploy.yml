name: Build OPA Bundle

on:
  push:
    branches:
      - dev
    paths:
      - '.opa/**'

env:
  REGISTRY: ghcr.io
  BUNDLE_NAME: ${{ github.repository }}/opa-bundle

jobs:
  build:
    name: Build and push OPA bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Test OPA policies
        run: |
          echo "Running OPA policy tests..."
          opa test .opa -v
          echo "All tests passed!"

      - name: Setup ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Build OPA bundle
        run: |
          opa build -b .opa --ignore "*_test.rego" -o bundle.tar.gz
          echo "Bundle contents:"
          tar -tzf bundle.tar.gz

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bundle to GHCR
        id: push
        run: |
          # Push with SHA tag and capture digest
          DIGEST=$(oras push ${{ env.REGISTRY }}/${{ env.BUNDLE_NAME }}:sha-${{ github.sha }} \
            bundle.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip \
            --format json | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign bundle with cosign
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.BUNDLE_NAME }}@${{ steps.push.outputs.digest }}          

      - name: Summary
        run: |
          echo "## OPA Bundle Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}/${{ env.BUNDLE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA Tag:** sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "**Latest Tag:** main, latest" >> $GITHUB_STEP_SUMMARY
          fi